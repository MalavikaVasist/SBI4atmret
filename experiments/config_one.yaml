scratch_env: SCRATCH
home_env: HOME

observation:
  source: WISEJ1738
  instruments: 
    hst:
      # wavelength_range: [0.98, 2.2]
      path: JWST/observations/WISEJ1738/HST/patchy/spectrum.csv
    gemini:
      # wavelength_range: [0.98, 2.2]
      path: JWST/observations/WISEJ1738/GEMINI/patchy/spectrum.csv
    miri:
      # wavelength_range: [4.9, 19]
      path: JWST/observations/WISEJ1738/MIRI/cloudfree/spectrum.csv
  simulated: 
    path: JWST/observations/WISEJ1738/simulations/cloudfree/spectrum.csv


dataset:
  D: 7.34
  shuffle: true
  order: ["miri", "gemini", "hst"] ## important for pipe functions
  dataset_path:
    cloudfree:
      miri:
        path: JWST/simulations/sim_15NH3HCNTiOVOXH2OcLPbasefsedkzzslnbfacM_unregPT/MIRI/cloudfree/
      gemini:
        path: JWST/simulations/sim_15NH3HCNTiOVOXH2OcLPbasefsedkzzslnbfacM_unregPT/GEMINI/cloudfree/
      hst:
        path: JWST/simulations/sim_15NH3HCNTiOVOXH2OcLPbasefsedkzzslnbfacM_unregPT/HST/conv_rebinned/cloudfree/
  savepath: JWST/runs/WISEJ1738/model_15NH3HCNTiOVOXH2OcLPbasefsedkzzslnbfacM_unregPT/MIRI+HST+Gemini/cloudfree/
  pipe:
    type: pipes.pipe_HST_Gemini_MIRI_cloudfree.MiriGeminiHSTPipe
    kwargs: {}
  noise:
    type: likelihoods.gaussian.Gaussian
    kwargs: {}

simulator:
  cloudfree_miri:
    type: simulators.simulator.Simulator
    kwargs:
      emission_model:
        type: utils.emission_model_general.emission_model_diseq
        kwargs: {}
      PT_profile:
        type: utils.PT_profiles.pt_profile
        kwargs: {}
      line_species: 
        - CH4_hargreaves
        - H2O_Exomol
        - CO2
        - CO_all_iso_HITEMP
        - H2S
        - NH3
        - PH3
        - 15NH3
        - HCN
        - TiO_all_Exomol
        - VO
      cloud_species: null
      rayleigh_species: [H2, He]
      continuum_opacities: [H2-H2, H2-He]
      names: 
        - R_pl
        - mass
        - T_bottom
        - temp_node_1
        - temp_node_2
        - temp_node_3
        - temp_node_4
        - temp_node_5
        - temp_node_6
        - temp_node_7
        - temp_node_8
        - temp_node_9
        - H2O_mol_scale
        - CO2_mol_scale
        - CO_mol_scale
        - CH4_mol_scale
        - NH3_mol_scale
        - PH3_mol_scale
        - H2S_mol_scale
        - 15NH3_mol_scale
        - HCN_mol_scale
        - TiO_mol_scale
        - VO_mol_scale
        - bfactor_noise_gemini
        - bfactor_noise_hst
        - bfactor_noise_miri
      pressure_scaling: 10
      pressure_simple: 100
      pressure_width: 3
      scale: 1.0e5
      N_nodes: 10
      N_data_sets: 9.0
      D_pl: 9.9
      AMR: false
      do_scat_emis: false
      contribution: true
      PT_plot_mode: false
      conv: true
      a: 4.9
      b: 19
  cloudy_miri:
    type: simulators.simulator.Simulator
    kwargs: 
      emission_model:
        type: utils.emission_model_general.emission_model_diseq
        kwargs: {}
      PT_profile:
        type: utils.PT_profiles.pt_profile
        kwargs: {}
      line_species: 
        - CH4_hargreaves
        - H2O_Exomol
        - CO2
        - CO_all_iso_HITEMP
        - H2S
        - NH3
        - PH3
        - 15NH3
        - HCN
        - TiO_all_Exomol
        - VO
      cloud_species: null
      rayleigh_species: [H2, He]
      continuum_opacities: [H2-H2, H2-He]
      names: 
        - R_pl
        - mass
        - T_bottom
        - temp_node_1
        - temp_node_2
        - temp_node_3
        - temp_node_4
        - temp_node_5
        - temp_node_6
        - temp_node_7
        - temp_node_8
        - temp_node_9
        - H2O_mol_scale
        - CO2_mol_scale
        - CO_mol_scale
        - CH4_mol_scale
        - NH3_mol_scale
        - PH3_mol_scale
        - H2S_mol_scale
        - 15NH3_mol_scale
        - HCN_mol_scale
        - TiO_mol_scale
        - VO_mol_scale
        - log_X_cb_H2O(c)
        - log_Pbase_H2O(c)
        - fsed
        - log_kzz
        - sigma_lnorm
        - bfactor_noise_gemini
        - bfactor_noise_hst
        - bfactor_noise_miri
      pressure_scaling: 10
      pressure_simple: 100
      pressure_width: 3
      scale: 1.0e5
      N_nodes: 10
      N_data_sets: 9.0
      D_pl: 9.9
      AMR: false
      do_scat_emis: false
      contribution: true
      PT_plot_mode: false
      conv: true


prior:
  distribution:
    type: priors.BoxUniform
    kwargs: {}

  parameters:   
    - name: "$R_{P}$"
      lower: 0.5
      upper: 3

    - name: "$Mass$"
      lower: 1
      upper: 50

    - name: "$T_{bottom}$"
      lower: 100
      upper: 9000

    - name: "$tnode1$"
      lower: 0.2
      upper: 1.0

    - name: "$tnode2$"
      lower: 0.2
      upper: 1.0

    - name: "$tnode3$"
      lower: 0.2
      upper: 1.0

    - name: "$tnode4$"
      lower: 0.2
      upper: 1.0

    - name: "$tnode5$"
      lower: 0.2
      upper: 1.0

    - name: "$tnode6$"
      lower: 0.2
      upper: 1.0

    - name: "$tnode7$"
      lower: 0.2
      upper: 1.0

    - name: "$tnode8$"
      lower: 0.2
      upper: 1.0

    - name: "$tnode9$"
      lower: 0.2
      upper: 1.0

    - name: "$H_2O$"
      lower: -10
      upper: 0

    - name: "$CO_2$"
      lower: -10
      upper: 0

    - name: "$CO$"
      lower: -10
      upper: 0

    - name: "$CH_4$"
      lower: -10
      upper: 0

    - name: "$NH_3$"
      lower: -10
      upper: 0

    - name: "$PH_3$"
      lower: -10
      upper: 0

    - name: "$H_2S$"
      lower: -10
      upper: 0

    - name: "$^{15}NH_3$"
      lower: -10
      upper: 0

    - name: "$HCN$"
      lower: -10
      upper: 0

    - name: "$TiO$"
      lower: -10
      upper: 0

    - name: "$VO$"
      lower: -10
      upper: 0

    - name: "$b_{g}$"
      lower: -15
      upper: -7

    - name: "$b_{w}$"
      lower: -15
      upper: -7

    - name: "$b_{m}$"
      lower: -15
      upper: -7

estimator:
  flow:
    type: NPEFlow
    kwargs:
      hidden_features_no: 5
      hidden_features: [512]
      transforms: 5
      signal: 32

  embedding:
    type: SoftclipResMLP
    kwargs:
      bound: 100.0
      instruments:
        miri:
          hidden_features: [3, 5, 7]
          input_dim: 1298
          output_dim: 64
        gemini:
          hidden_features: [2, 3, 5]
          input_dim: 434
          output_dim: 16


training:
  optimizer:
    type: AdamW
    kwargs:
      init_lr: 5.0e-4
      weight_decay: 1.0e-3

  scheduler:
    type: ReduceLROnPlateau
    kwargs:
      factor: 0.5
      min_lr: 1.0e-8
      patience: 32
      threshold: 0.01

  loss: 
    type: BNPELoss
    kwargs: {}

  epoch_start: 0
  batch_size: 1024
  epoch_final: 800
  gradient_steps_train: 1700
  gradient_steps_valid: 170
  clip_grad_norm: 1.0
  stop_criterion: late_lr
  name: 1
  device: cpu


wandb:
  project: WISE1738
  array: 1
  cpus: 2
  gpus: 1
  ram: 16GB
  time: 10-00:00:00
  title: "WISEJ1738 - MIRI+HST+Gemini - cloudfree - 15NH3HCNTiOVOXH2OcLPbasefsedkzzslnbfacM_unregPT"