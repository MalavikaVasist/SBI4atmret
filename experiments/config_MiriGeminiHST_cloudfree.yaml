prior_config:
  distribution:
    type: priors.BoxUniform
    kwargs: {}

  parameters:
    - name: R_pl
      label: "$R_{P}$"
      lower: 0.5
      upper: 3

    - name: mass
      label: "$Mass$"
      lower: 1
      upper: 50

    - name: T_bottom
      label: "$T_{bottom}$"
      lower: 100
      upper: 9000

    - name: temp_node_1
      label: "$tnode1$"
      lower: 0.2
      upper: 1.0

    - name: temp_node_2
      label: "$tnode2$"
      lower: 0.2
      upper: 1.0

    - name: temp_node_3
      label: "$tnode3$"
      lower: 0.2
      upper: 1.0

    - name: temp_node_4
      label: "$tnode4$"
      lower: 0.2
      upper: 1.0

    - name: temp_node_5
      label: "$tnode5$"
      lower: 0.2
      upper: 1.0

    - name: temp_node_6
      label: "$tnode6$"
      lower: 0.2
      upper: 1.0

    - name: temp_node_7
      label: "$tnode7$"
      lower: 0.2
      upper: 1.0

    - name: temp_node_8
      label: "$tnode8$"
      lower: 0.2
      upper: 1.0

    - name: temp_node_9
      label: "$tnode9$"
      lower: 0.2
      upper: 1.0

    - name: H2O_mol_scale
      label: "$H_2O$"
      lower: -10
      upper: 0

    - name: CO2_mol_scale
      label: "$CO_2$"
      lower: -10
      upper: 0

    - name: CO_mol_scale
      label: "$CO$"
      lower: -10
      upper: 0

    - name: CH4_mol_scale
      label: "$CH_4$"
      lower: -10
      upper: 0

    - name: NH3_mol_scale
      label: "$NH_3$"
      lower: -10
      upper: 0

    - name: PH3_mol_scale
      label: "$PH_3$"
      lower: -10
      upper: 0

    - name: H2S_mol_scale
      label: "$H_2S$"
      lower: -10
      upper: 0

    - name: 15NH3_mol_scale
      label: "$^{15}NH_3$"
      lower: -10
      upper: 0

    - name: HCN_mol_scale
      label: "$HCN$"
      lower: -10
      upper: 0

    - name: TiO_mol_scale
      label: "$TiO$"
      lower: -10
      upper: 0

    - name: VO_mol_scale
      label: "$VO$"
      lower: -10
      upper: 0

    - name: bfactor_noise_gemini
      label: "$b_{g}$"
      lower: -15
      upper: -7

    - name: bfactor_noise_hst
      label: "$b_{w}$"
      lower: -15
      upper: -7

    - name: bfactor_noise_miri
      label: "$b_{m}$"
      lower: -15
      upper: -7

estimator_config:
  flow:
    type: estimator.flows.npe.NPEFlow
    kwargs:
      hidden_features_no: 5
      hidden_features: [512]
      transforms: 5
      signal: 32

  embedding:
    type: estimator.embedding.SoftClip.SoftclipResMLP
    kwargs:
      bound: 100.0
      instruments:
        miri:
          hidden_features: [3, 5, 7]
          input_dim: 1298
          output_dim: 64
        gemini:
          hidden_features: [2, 3, 5]
          input_dim: 434
          output_dim: 16


training_config:
  optimizer:
    type: AdamW
    kwargs:
      init_lr: 5.0e-4
      weight_decay: 1.0e-3

  scheduler:
    type: ReduceLROnPlateau
    kwargs:
      factor: 0.5
      min_lr: 1.0e-8
      patience: 32
      threshold: 0.01

  loss: 
    type: BNPELoss
    kwargs: {}

  epoch_start: 0
  batch_size: 1024
  epoch_final: 800
  gradient_steps_train: 1700
  gradient_steps_valid: 170
  clip_grad_norm: 1.0
  stop_criterion: late_lr
  name: 1
  device: cpu
  checkpoint_interval: 100
  output_dir: JWST/runs/WISEJ1738/model_15NH3HCNTiOVOXH2OcLPbasefsedkzzslnbfacM_unregPT/MIRI+HST+Gemini/cloudfree/

wandb:
  project: WISE1738
  title: "WISEJ1738 - MIRI+HST+Gemini - cloudfree"