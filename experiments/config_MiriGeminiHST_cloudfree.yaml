scratch_env: SCRATCH
home_env: HOME

observation_config:
  source: WISEJ1738
  instruments: 
    hst:
      # wavelength_range: [0.98, 2.2]
      path: JWST/observations/WISEJ1738/HST/patchy/spectrum.csv
    gemini:
      # wavelength_range: [0.98, 2.2]
      path: JWST/observations/WISEJ1738/GEMINI/patchy/spectrum.csv
    miri:
      # wavelength_range: [4.9, 19]
      path: JWST/observations/WISEJ1738/MIRI/cloudfree/spectrum.csv
  simulated: 
    path: JWST/observations/WISEJ1738/simulations/cloudfree/spectrum.csv


dataset_config:
  D: 7.34
  shuffle: true
  dataset_path:
    cloudfree_miri:
        path: JWST/simulations/sim_15NH3HCNTiOVOXH2OcLPbasefsedkzzslnbfacM_unregPT/cloudfree_miri/
    cloudfree_gemini:
      path: JWST/simulations/sim_15NH3HCNTiOVOXH2OcLPbasefsedkzzslnbfacM_unregPT/cloudfree_gemini/
    cloudfree_hst:
      path: JWST/simulations/sim_15NH3HCNTiOVOXH2OcLPbasefsedkzzslnbfacM_unregPT/cloudfree_hst/
  pipe:
    type: pipes.pipe_cloudfree_MiriGeminiHST.MiriGeminiHSTcloudfreePipe
    kwargs: {}        
  noise:
    type: likelihoods.gaussian.Gaussian
    kwargs: {}
  
