scratch_env: SCRATCH
home_env: HOME

observation:
  source: WISEJ1738
  instruments: 
    hst :
      wavelength_ranges: [0.98, 2.2]
      path: [JWST/simulations/sim_15NH3HCNTiOVOXH2OcLPbasefsedkzzslnbfacM_unregPT/HST/conv_rebinned/cloudfree/spectrum.csv]
    gemini :
      wavelength_ranges: [0.98, 2.2]
      path: [JWST/simulations/sim_15NH3HCNTiOVOXH2OcLPbasefsedkzzslnbfacM_unregPT/GEMINI/conv_rebinned/cloudfree/spectrum.csv]
    miri :
      wavelength_ranges: [4.9, 19]
      path: [JWST/simulations/sim_15NH3HCNTiOVOXH2OcLPbasefsedkzzslnbfacM_unregPT/MIRI/conv_rebinned/cloudfree/spectrum.csv]
  simulation: false 
  
  dataset:
    D: 7.34
    dataset_path:   
      cloudfree:
          miri: 
            path: JWST/simulations/sim_15NH3HCNTiOVOXH2OcLPbasefsedkzzslnbfacM_unregPT/MIRI/cloudfree/
          gemini: 
            path: JWST/simulations/sim_15NH3HCNTiOVOXH2OcLPbasefsedkzzslnbfacM_unregPT/GEMINI/cloudfree/
          hst: 
            path: JWST/simulations/sim_15NH3HCNTiOVOXH2OcLPbasefsedkzzslnbfacM_unregPT/HST/conv_rebinned/cloudfree/
      cloudy:
          miri: 
            path: JWST/simulations/sim_15NH3HCNTiOVOXH2OcLPbasefsedkzzslnbfacM_unregPT/MIRI/cloudy/
          gemini: 
            path: JWST/simulations/sim_15NH3HCNTiOVOXH2OcLPbasefsedkzzslnbfacM_unregPT/GEMINI/cloudy/
          hst: 
            path: JWST/simulations/sim_15NH3HCNTiOVOXH2OcLPbasefsedkzzslnbfacM_unregPT/HST/conv_rebinned/cloudy/
    savepath: [JWST/runs/WISEJ1738/model_15NH3HCNTiOVOXH2OcLPbasefsedkzzslnbfacM_unregPT/MIRI+HST+Gemini/cloudfree/]


simulator:
