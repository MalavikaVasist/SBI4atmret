[project]
name = "sbi4exoplanets"
version = "0.1.0"
description = "Python package for SBI4exoplanets atmospheric retrieval."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.8"
authors = [
    {name = "Your Name", email = "your.email@example.com"},
]
maintainers = [
    {name = "Your Name", email = "your.email@example.com"},
]
keywords = ["astronomy", "exoplanets", "atmospheric retrieval", "SBI"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "numpy",
    "matplotlib",
    "pandas",
    "tqdm",
    "torch",
    "wandb",
    "petitRADTRANS",
    "lampe",
    "zuko",
    "pyyaml",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]
docs = ["sphinx", "sphinx-rtd-theme"]

[project.urls]
Homepage = "https://github.com/yourusername/sbi4exoplanets"
Documentation = "https://sbi4exoplanets.readthedocs.io/"
Repository = "https://github.com/yourusername/sbi4exoplanets"
Issues = "https://github.com/yourusername/sbi4exoplanets/issues"
Changelog = "https://github.com/yourusername/sbi4exoplanets/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["sbi4exoplanets*"]

[tool.setuptools.package-data]
sbi4exoplanets = ["*.json", "*.py"]

[build-system]
requires = ["setuptools >=64.0.0", "wheel >=0.40.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 88
target-version = "py38"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long, handled by black
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*" = ["B011"]  # assert false

[tool.ruff.isort]
known-first-party = ["sbi4exoplanets"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "petitRADTRANS.*",
    "lampe.*",
    "zuko.*",
    "wandb.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]







